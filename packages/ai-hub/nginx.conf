# ai-hub's vite base is '/ai/' (see vite.config.js), so its built asset
# URLs are already absolute under /ai/ — serve it from that same subpath
# here rather than root, and 404 (not the SPA fallback) is correct since
# ai-hub has no client-side router.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /ai/ {
        try_files $uri $uri/ =404;
    }
}
