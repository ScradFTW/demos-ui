# Deploys on push to main when packages/ai-tools/** changes — see
# bradjobe-dev-infra's cloudbuild_triggers.tf (google_cloudbuild_trigger.app["ai-tools"]).
steps:
  - id: test
    name: node:22
    entrypoint: bash
    args:
      - -c
      - npm ci && npm run test --workspace=ai-tools

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - packages/ai-tools/Dockerfile
      - -t
      - ${_ARTIFACT_REGISTRY}/ai-tools:${SHORT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_ARTIFACT_REGISTRY}/ai-tools:${SHORT_SHA}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ai-tools
      - --image=${_ARTIFACT_REGISTRY}/ai-tools:${SHORT_SHA}
      - --region=${_REGION}
      - --quiet

substitutions:
  _REGION: northamerica-northeast1
  _ARTIFACT_REGISTRY: northamerica-northeast1-docker.pkg.dev/bradjobe-dev/apps

options:
  logging: CLOUD_LOGGING_ONLY
